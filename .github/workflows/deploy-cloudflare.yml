name: Deploy MitoMapa to Cloudflare

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mitomapa-cloudflare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-browser-tests.txt
          .venv/bin/python -m playwright install --with-deps chromium chrome
          sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Check deployment policy and release packages
        run: |
          npm audit --package-lock-only --ignore-scripts --audit-level=moderate
          python3 -m unittest discover -s tests -p 'test_deploy_policy.py'
          python3 -m unittest discover -s tests -p 'test_custom_domain_preflight.py'
          python3 -m unittest discover -s tests -p 'test_https_redirect.py'
          python3 -m unittest discover -s tests -p 'test_public_transport.py'
          python3 -m unittest discover -s tests -p 'test_python_lock.py'
          python3 -m unittest discover -s tests -p 'test_archive_limits.py'
          python3 -m unittest discover -s tests -p 'test_narration_security.py'
          python3 -m unittest discover -s tests -p 'test_maintenance_tools.py'
          python3 -m unittest discover -s tests -p 'test_elpx_resource_links.py'
          python3 -m unittest discover -s tests -p 'test_jspdf_policy.py'
          python3 -m unittest discover -s tests -p 'test_release_pipeline.py'
          python3 -m unittest discover -s tests -p 'test_story_media_release.py'
          python3 -m unittest discover -s tests -p 'test_fetch_story_media.py'
          .venv/bin/python -m unittest discover -s tests -p 'test_fflate_security.py'
          python3 -m unittest discover -s tests -p 'test_backup_stage.py'
          .venv/bin/python -m unittest discover -s tests -p 'test_sync_current_elpx.py'
          .venv/bin/python -m unittest discover -s tests -p 'test_native_runtime_security.py'
          .venv/bin/python -m unittest discover -s tests -p 'test_editorial_elpx.py'
          .venv/bin/python -m unittest discover -s tests -p 'test_native_audit_fixes.py'
          .venv/bin/python -m unittest discover -s tests -p 'test_passport_native*.py'
          node --test tests/*.test.js
          .venv/bin/python3 tools/sync_current_elpx.py --check
          python3 tools/update_release.py --check
          python3 tools/harden_jspdf_exports.py --check
          python3 tools/harden_drawing_archives.py --check
      - name: Check browser behaviour
        run: |
          .venv/bin/python tools/run_browser_checks.py \
            test_diploma_print_browser.py test_experience_browser.py test_journey_browser.py \
            test_drawing_browser.py test_jspdf_browser.py test_names_browser.py \
            test_pieces_browser.py \
            test_story_formats_browser.py \
            test_editorial_elpx_browser.py test_native_audit_browser.py \
            test_navigation_accessibility_browser.py \
            test_persistent_state_browser.py test_text_resize_browser.py \
            test_fflate_security_browser.py
          .venv/bin/python tools/run_browser_checks.py \
            test_map_choice_browser.py test_reading_support_browser.py \
            test_learning_support_browser.py test_game_access_browser.py \
            test_expedition_browser.py test_native_runtime_security_browser.py
      - name: Verify and stage static files
        run: python3 tools/prepare_deploy.py
  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.repository == 'crgarsan/mitomapa-canario'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify and stage static files
        run: python3 tools/prepare_deploy.py
      - name: Install Wrangler
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify public transport before publication
        run: python3 tools/check_public_transport.py
      - name: Deploy existing Worker
        run: |
          python3 - <<'PY'
          import json, os, subprocess, uuid
          from pathlib import Path
          temporary = Path(os.environ['RUNNER_TEMP'])
          original = json.loads(Path('wrangler.jsonc').read_text())
          if original['name'] != 'mitomapa-canario':
              raise SystemExit('The publication must target the existing MitoMapa Worker.')
          config = {key: original[key] for key in ('name', 'compatibility_date', 'assets')}
          config['assets'] = {**config['assets'], 'directory': str(Path(config['assets']['directory']).resolve())}
          config_path = temporary / 'mitomapa-assets-only.json'
          config_path.write_text(json.dumps(config))
          report_path = temporary / ('mitomapa-upload-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'] + '.jsonl')
          if report_path.exists():
              raise SystemExit('The upload report must be new.')
          cli = './node_modules/.bin/wrangler'
          common = ['--config', str(config_path), '--name', 'mitomapa-canario']
          subprocess.run([cli, 'versions', 'upload', *common, '--keep-vars', '--strict', '--message', os.environ['GITHUB_SHA']],
                         env={**os.environ, 'WRANGLER_OUTPUT_FILE_PATH': str(report_path)}, check=True)
          try:
              if not report_path.is_file() or report_path.is_symlink() or report_path.stat().st_size > 1024 * 1024:
                  raise ValueError()
              lines = [line for line in report_path.read_text(encoding='utf-8').splitlines() if line.strip()]
              if not lines or len(lines) > 100:
                  raise ValueError()
              entries = [json.loads(line) for line in lines]
              if any(not isinstance(entry, dict) for entry in entries):
                  raise ValueError()
              reports = [entry for entry in entries if entry.get('type') == 'version-upload']
              if len(reports) != 1:
                  raise ValueError()
              report = reports[0]
              version_id = report.get('version_id')
              if (type(report.get('version')) is not int or report['version'] != 1
                      or report.get('worker_name') != 'mitomapa-canario'
                      or not isinstance(version_id, str) or str(uuid.UUID(version_id)) != version_id):
                  raise ValueError()
          except (OSError, ValueError, UnicodeError, RecursionError):
              raise SystemExit('The upload report must identify one valid version of the expected Worker.') from None
          print('Uploaded approved Worker version: ' + version_id)
          subprocess.run([cli, 'versions', 'deploy', version_id + '@100%', *common, '--yes', '--message', os.environ['GITHUB_SHA']], check=True)
          PY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify public transport after publication
        run: python3 tools/check_public_transport.py
