name: Deploy MitoMapa to Cloudflare

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mitomapa-cloudflare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install browser test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements-browser-tests.txt
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Check deployment policy and release packages
        run: |
          npm audit --package-lock-only --ignore-scripts --audit-level=moderate
          python3 -m unittest discover -s tests -p 'test_deploy_policy.py'
          python3 -m unittest discover -s tests -p 'test_custom_domain_preflight.py'
          python3 -m unittest discover -s tests -p 'test_https_redirect.py'
          python3 -m unittest discover -s tests -p 'test_elpx_resource_links.py'
          python3 -m unittest discover -s tests -p 'test_jspdf_policy.py'
          python3 -m unittest discover -s tests -p 'test_release_pipeline.py'
          .venv/bin/python -m unittest discover -s tests -p 'test_sync_current_elpx.py'
          .venv/bin/python -m unittest discover -s tests -p 'test_editorial_elpx.py'
          .venv/bin/python -m unittest discover -s tests -p 'test_passport_native*.py'
          node --test tests/drawing-import.test.js
          .venv/bin/python3 tools/sync_current_elpx.py --check
          python3 tools/update_release.py --check
      - name: Check browser behaviour
        run: |
          .venv/bin/python tools/run_browser_checks.py \
            test_experience_browser.py test_journey_browser.py \
            test_drawing_browser.py test_jspdf_browser.py test_names_browser.py \
            test_pieces_browser.py \
            test_editorial_elpx_browser.py
      - name: Verify and stage static files
        run: python3 tools/prepare_deploy.py
  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.repository == 'crgarsan/mitomapa-canario'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify and stage static files
        run: python3 tools/prepare_deploy.py
      - name: Install Wrangler
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Deploy existing Worker
        run: |
          python3 tools/check_custom_domain.py
          ./node_modules/.bin/wrangler deploy --config wrangler.jsonc
          python3 tools/ensure_https_redirect.py
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
