name: Verify MitoMapa www without deployment

on:
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check public www with standard TLS and no credentials
        run: |
          python3 - <<'PY'
          import json, socket
          from urllib.request import Request, build_opener, HTTPRedirectHandler, urlopen
          from urllib.error import HTTPError
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs): return None
          opener = build_opener(NoRedirect())
          rows = []
          for scheme in ('http', 'https'):
              for path in ('/', '/downloads/MitoMapa_canario_GobCan.elpx?transport-check=1'):
                  current = scheme + '://www.mitomapacanario.org' + path
                  chain = []
                  for hop in range(3):
                      request = Request(current, method='HEAD', headers={'User-Agent': 'MitoMapa-transport-check'})
                      try:
                          with opener.open(request, timeout=30) as response:
                              status, location = response.status, response.headers.get('Location')
                      except HTTPError as response:
                          status, location = response.code, response.headers.get('Location')
                          response.close()
                      chain.append({'url': current, 'status': status, 'location': location})
                      if status == 200:
                          assert current == 'https://mitomapacanario.org' + path, chain
                          break
                      assert status in (301, 308), chain
                      assert location in ('https://www.mitomapacanario.org' + path, 'https://mitomapacanario.org' + path), chain
                      assert location != current, chain
                      current = location
                  else: raise AssertionError(chain)
                  rows.append(chain)
          with urlopen(Request('https://mitomapacanario.org/VERSION.json', headers={'User-Agent':'MitoMapa-transport-check'}), timeout=30) as response:
              version = json.loads(response.read(65536))
          assert version['web_version'] == '4.9.3'
          assert version['rea_exelearning_version'] == '4.8.9'
          assert version['download']['sha256'] == '2b595cc0851d78dec66dd4e595e4ced9a9be012955986f14cba37ce32750fb8a'
          print(json.dumps({'passed': True, 'dns': sorted({r[4][0] for r in socket.getaddrinfo('www.mitomapacanario.org',443)}), 'tls':'normal certificate and hostname validation; no insecure context', 'chains': rows, 'web_version':version['web_version'], 'rea_version':version['rea_exelearning_version']}))
          PY
