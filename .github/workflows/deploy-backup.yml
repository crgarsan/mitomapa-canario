name: Validate and publish the independent backup

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the verified backup after the owner configures Pages
        type: boolean
        default: false

concurrency:
  group: mitomapa-github-pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      manifest_sha: ${{ steps.backup.outputs.manifest_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Test the independent stage policy
        run: python3 -m unittest discover -s tests -p 'test_backup_stage.py'
      - name: Verify the release and build a complete backup below 1 GB
        id: backup
        run: |
          python3 tools/update_release.py --check
          python3 tools/prepare_backup.py --source-commit "$GITHUB_SHA" --base-path "/${GITHUB_REPOSITORY#*/}/" > "$RUNNER_TEMP/backup-report.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'backup-report.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('manifest_sha=' + report['backup_manifest_sha256'] + '\n')
          print(json.dumps(report))
          PY
      - name: Verify every staged checksum
        working-directory: .backup
        run: sha256sum --check SHA256SUMS.txt
      - name: Upload only the verified public backup
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .backup
          retention-days: 1
          include-hidden-files: false

  deploy:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main' && github.repository == 'crgarsan/mitomapa-canario'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the owner-configured Pages site without enabling it
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          enablement: false
      - name: Require the independent github.io project address
        env:
          PAGES_HOST: ${{ steps.pages.outputs.host }}
          PAGES_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          python3 - <<'PY'
          import os
          if os.environ['PAGES_HOST'] != 'crgarsan.github.io' or os.environ['PAGES_PATH'].rstrip('/') != '/mitomapa-canario':
              raise SystemExit('Configure Pages at its independent github.io address without the primary custom domain.')
          PY
      - name: Publish the already verified artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
      - name: Verify the certificate and the exact published MitoMapa content
        env:
          BACKUP_URL: ${{ steps.deployment.outputs.page_url }}
          BACKUP_MANIFEST_SHA: ${{ needs.validate.outputs.manifest_sha }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if python3 tools/prepare_backup.py --verify-url "$BACKUP_URL" --source-commit "$GITHUB_SHA" --expected-manifest-sha "$BACKUP_MANIFEST_SHA"; then
              exit 0
            fi
            sleep 10
          done
          exit 1
